name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up JBR 25
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: jetbrains
          java-version: 25.0.2

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0
        with:
          validate-wrappers: true
          cache-provider: basic

      - name: Prepare pinned local ASR inputs
        run: ./scripts/prepare-local-asr.sh

      - name: Prepare legal assets
        run: ./scripts/prepare-legal-assets.sh

      - name: Test, lint, and assemble
        run: ./gradlew --no-daemon test lintDebug assembleDebug assembleRelease

      # APK upload is intentionally omitted. See docs/release-checklist.md.
